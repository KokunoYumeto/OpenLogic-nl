<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="title desc"><title id="title">Pijlendiagram: bijectieve functie</title><desc id="desc">Pijlendiagram van een bijectieve functie; elk getekend domeinelement heeft precies één pijl naar het codomein.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><ellipse cx="120" cy="130" rx="82" ry="112" fill="#dcecff" stroke="#245" stroke-width="3"/><ellipse cx="360" cy="130" rx="82" ry="112" fill="#fff0dc" stroke="#742" stroke-width="3"/><circle cx="120" cy="70" r="7" fill="#222"/><circle cx="120" cy="130" r="7" fill="#222"/><circle cx="120" cy="190" r="7" fill="#222"/><circle cx="360" cy="70" r="7" fill="#222"/><circle cx="360" cy="130" r="7" fill="#222"/><circle cx="360" cy="190" r="7" fill="#222"/><line x1="128" y1="70" x2="350" y2="70" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/><line x1="128" y1="130" x2="350" y2="130" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/><line x1="128" y1="190" x2="350" y2="190" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/></svg>
