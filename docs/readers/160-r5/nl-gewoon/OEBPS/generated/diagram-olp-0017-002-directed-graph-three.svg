<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="title desc"><title id="title">Gerichte graaf</title><desc id="desc">Gerichte graaf met een lus bij 1 en de pijlen 1→2, 1→3 en 2→3.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M75 52 C45 5, 130 5, 105 52" fill="none" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/><line x1="90" y1="70" x2="250" y2="70" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/><line x1="90" y1="70" x2="250" y2="190" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/><line x1="250" y1="70" x2="250" y2="190" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/><circle cx="90" cy="70" r="24" fill="white" stroke="#222" stroke-width="3"/><text x="90" y="78" text-anchor="middle" font-size="24">1</text><circle cx="250" cy="70" r="24" fill="white" stroke="#222" stroke-width="3"/><text x="250" y="78" text-anchor="middle" font-size="24">2</text><circle cx="250" cy="190" r="24" fill="white" stroke="#222" stroke-width="3"/><text x="250" y="198" text-anchor="middle" font-size="24">3</text></svg>
