<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="title desc"><title id="title">Overlappende rechthoeken met maten n en m</title><desc id="desc">Twee verschoven vierkanten binnen een omhullende rechthoek; de verticale lengten n en m geven de twee schaalmaten aan.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="50" y="30" width="310" height="190" fill="none" stroke="#222" stroke-width="4"/><rect x="50" y="75" width="235" height="145" fill="#e66" fill-opacity=".45" stroke="#933" stroke-width="3"/><rect x="125" y="30" width="235" height="145" fill="#edc54f" fill-opacity=".45" stroke="#986" stroke-width="3"/><rect x="125" y="75" width="160" height="100" fill="#e98a34" fill-opacity=".55"/><line x1="395" y1="75" x2="395" y2="220" stroke="#222" stroke-width="3"/><text x="410" y="150" font-size="24">n</text><line x1="445" y1="30" x2="445" y2="220" stroke="#222" stroke-width="3"/><text x="458" y="130" font-size="24">m</text></svg>
