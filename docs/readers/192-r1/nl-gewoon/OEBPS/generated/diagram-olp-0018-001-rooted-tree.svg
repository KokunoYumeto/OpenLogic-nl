<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="title desc"><title id="title">Gewortelde boom</title><desc id="desc">Boom met wortel r; r heeft kinderen a en b, en a heeft kinderen c, d en e.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><line x1="240" y1="40" x2="150" y2="115" stroke="#222" stroke-width="3"/><line x1="240" y1="40" x2="330" y2="115" stroke="#222" stroke-width="3"/><line x1="150" y1="115" x2="80" y2="210" stroke="#222" stroke-width="3"/><line x1="150" y1="115" x2="150" y2="210" stroke="#222" stroke-width="3"/><line x1="150" y1="115" x2="220" y2="210" stroke="#222" stroke-width="3"/><circle cx="240" cy="40" r="22" fill="white" stroke="#222" stroke-width="3"/><text x="240" y="47" text-anchor="middle" font-size="22">r</text><circle cx="150" cy="115" r="22" fill="white" stroke="#222" stroke-width="3"/><text x="150" y="122" text-anchor="middle" font-size="22">a</text><circle cx="330" cy="115" r="22" fill="white" stroke="#222" stroke-width="3"/><text x="330" y="122" text-anchor="middle" font-size="22">b</text><circle cx="80" cy="210" r="22" fill="white" stroke="#222" stroke-width="3"/><text x="80" y="217" text-anchor="middle" font-size="22">c</text><circle cx="150" cy="210" r="22" fill="white" stroke="#222" stroke-width="3"/><text x="150" y="217" text-anchor="middle" font-size="22">d</text><circle cx="220" cy="210" r="22" fill="white" stroke="#222" stroke-width="3"/><text x="220" y="217" text-anchor="middle" font-size="22">e</text></svg>
