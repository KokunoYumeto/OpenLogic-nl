<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="title desc"><title id="title">Hilberts hotel: verschuiving n naar n+1</title><desc id="desc">Elke gast uit kamer n verhuist naar kamer n+1; daardoor komt kamer 1 vrij voor een nieuwe gast.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="30" y="75" font-size="20">oude kamer</text><text x="30" y="175" font-size="20">nieuwe kamer</text><text x="125" y="72" text-anchor="middle" font-size="18">1</text><text x="125" y="178" text-anchor="middle" font-size="18">1</text><line x1="125" y1="82" x2="161" y2="158" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><text x="161" y="72" text-anchor="middle" font-size="18">2</text><text x="161" y="178" text-anchor="middle" font-size="18">2</text><line x1="161" y1="82" x2="197" y2="158" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><text x="197" y="72" text-anchor="middle" font-size="18">3</text><text x="197" y="178" text-anchor="middle" font-size="18">3</text><line x1="197" y1="82" x2="233" y2="158" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><text x="233" y="72" text-anchor="middle" font-size="18">4</text><text x="233" y="178" text-anchor="middle" font-size="18">4</text><line x1="233" y1="82" x2="269" y2="158" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><text x="269" y="72" text-anchor="middle" font-size="18">5</text><text x="269" y="178" text-anchor="middle" font-size="18">5</text><line x1="269" y1="82" x2="305" y2="158" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="72" text-anchor="middle" font-size="18">6</text><text x="305" y="178" text-anchor="middle" font-size="18">6</text><line x1="305" y1="82" x2="341" y2="158" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><text x="341" y="72" text-anchor="middle" font-size="18">7</text><text x="341" y="178" text-anchor="middle" font-size="18">7</text><line x1="341" y1="82" x2="377" y2="158" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><text x="377" y="72" text-anchor="middle" font-size="18">8</text><text x="377" y="178" text-anchor="middle" font-size="18">8</text><line x1="377" y1="82" x2="413" y2="158" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><text x="413" y="72" text-anchor="middle" font-size="18">9</text><text x="413" y="178" text-anchor="middle" font-size="18">9</text><text x="455" y="72" font-size="20">…</text><text x="455" y="178" font-size="20">…</text><circle cx="125" cy="174" r="18" fill="none" stroke="#b22" stroke-width="3"/></svg>
